<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Circadian — a palette that moves with the sun">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#11151f"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1a2440"/>
      <stop offset="22%"  stop-color="#3a5a8a"/>
      <stop offset="40%"  stop-color="#d9b06a"/>
      <stop offset="50%"  stop-color="#ffd58a"/>
      <stop offset="60%"  stop-color="#f59f4a"/>
      <stop offset="78%"  stop-color="#a04a7a"/>
      <stop offset="100%" stop-color="#1c1a2e"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffe4ab"/>
      <stop offset="60%"  stop-color="#f59f4a"/>
      <stop offset="100%" stop-color="#c05a2a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Solar gradient band: a horizon strip running the width of the card -->
  <rect x="0" y="430" width="1200" height="6" fill="url(#band)" opacity="0.95"/>
  <rect x="0" y="436" width="1200" height="120" fill="url(#band)" opacity="0.18"/>

  <!-- The sun -->
  <circle cx="980" cy="430" r="150" fill="url(#sun)"/>
  <circle cx="980" cy="430" r="54" fill="#ffd58a" opacity="0.95"/>

  <!-- Wordmark dot -->
  <circle cx="92" cy="116" r="9" fill="#ffd58a"/>
  <text x="112" y="124" font-family="Inter, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="28" font-weight="600" fill="#e8ecf3" letter-spacing="0.6">Circadian</text>

  <!-- Eyebrow -->
  <text x="92" y="220" font-family="Inter, system-ui, sans-serif"
        font-size="22" font-weight="500" fill="#9aa4b8" letter-spacing="3">EASY ON YOUR EYES — DAY AND NIGHT</text>

  <!-- Headline / mission -->
  <text x="92" y="304" font-family="Inter, system-ui, sans-serif"
        font-size="64" font-weight="700" fill="#f3f5fa" letter-spacing="-0.5">A palette that moves</text>
  <text x="92" y="378" font-family="Inter, system-ui, sans-serif"
        font-size="64" font-weight="700" font-style="italic" fill="#ffd58a" letter-spacing="-0.5">with the sun.</text>

  <!-- Subhead / mission line -->
  <text x="92" y="510" font-family="Inter, system-ui, sans-serif"
        font-size="26" font-weight="400" fill="#c2c9d8">Crisp and clear when you're focused, warm and soft after sunset —</text>
  <text x="92" y="546" font-family="Inter, system-ui, sans-serif"
        font-size="26" font-weight="400" fill="#c2c9d8">so your eyes stay comfortable from morning to midnight.</text>
</svg>
